<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhishGuard | Student-Focused URL Safety Analyzer</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #FDFBF7;
            --card-bg: #FFFFFF;
            --text-main: #2C2A29;
            --text-muted: #6B6560;
            --accent: #8B5A2B;
            --border-color: #E8E2D5;
            --safe-bg: #EAF4ED;
            --safe-text: #2D6A4F;
            --warn-bg: #FCF3DC;
            --warn-text: #946200;
            --danger-bg: #FDE8E8;
            --danger-text: #C53030;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 40px 20px;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: var(--text-main);
            margin-bottom: 10px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.05rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            margin-bottom: 25px;
        }

        .input-group {
            display: flex;
            gap: 12px;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px 18px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
            font-family: 'Inter', sans-serif;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
        }

        button {
            background-color: var(--text-main);
            color: #FFFFFF;
            border: none;
            padding: 14px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--accent);
        }

        .results-container {
            display: none;
            margin-top: 25px;
        }

        .status-badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .status-safe { background-color: var(--safe-bg); color: var(--safe-text); }
        .status-warning { background-color: var(--warn-bg); color: var(--warn-text); }
        .status-danger { background-color: var(--danger-bg); color: var(--danger-text); }

        .breakdown-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .breakdown-box {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 15px;
        }

        .breakdown-box span {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 4px;
        }

        .breakdown-box strong {
            font-size: 0.95rem;
            word-break: break-all;
        }

        .checks-list {
            list-style: none;
        }

        .checks-list li {
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checks-list li:last-child {
            border-bottom: none;
        }

        footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>PhishGuard</h1>
            <p>Student-Focused Phishing & Malicious URL Safety Analyzer</p>
        </header>

        <div class="card">
            <div class="input-group">
                <input type="text" id="urlInput" placeholder="Paste a link to check (e.g., https://github.com)...">
                <button onclick="analyzeUrl()">Analyze Link</button>
            </div>

            <div id="results" class="results-container">
                <div id="statusBadge" class="status-badge">Safe</div>

                <div class="breakdown-grid">
                    <div class="breakdown-box">
                        <span>Protocol</span>
                        <strong id="resProtocol">-</strong>
                    </div>
                    <div class="breakdown-box">
                        <span>Domain</span>
                        <strong id="resDomain">-</strong>
                    </div>
                    <div class="breakdown-box">
                        <span>Risk Score</span>
                        <strong id="resScore">0 / 100</strong>
                    </div>
                </div>

                <h3 style="font-family: 'Playfair Display', serif; font-size: 1.2rem; margin-bottom: 12px;">Security Heuristics Breakdown</h3>
                <ul id="checksList" class="checks-list">
                    <!-- Dynamic checks injected here -->
                </ul>
            </div>
        </div>

        <footer>
            SANKALP 2026 · Chennai Institute of Technology Student Project
        </footer>
    </div>

    <script>
        function analyzeUrl() {
            const rawInput = document.getElementById('urlInput').value.trim();
            const resultsDiv = document.getElementById('results');
            const statusBadge = document.getElementById('statusBadge');
            const resProtocol = document.getElementById('resProtocol');
            const resDomain = document.getElementById('resDomain');
            const resScore = document.getElementById('resScore');
            const checksList = document.getElementById('checksList');

            if (!rawInput) {
                alert('Please enter a valid URL.');
                return;
            }

            let urlToParse = rawInput;
            if (!urlToParse.startsWith('http://') && !urlToParse.startsWith('https://')) {
                urlToParse = 'https://' + urlToParse;
            }

            let parsed;
            try {
                parsed = new URL(urlToParse);
            } catch (e) {
                alert('Invalid URL format.');
                return;
            }

            let score = 0;
            let checks = [];

            // Trusted Whitelist Check
            const trustedDomains = ['github.com', 'google.com', 'citchennai.edu.in', 'wikipedia.org', 'microsoft.com'];
            const isTrusted = trustedDomains.some(domain => parsed.hostname === domain || parsed.hostname.endsWith('.' + domain));

            if (isTrusted) {
                score = 0;
                checks.push({ text: 'Passed: Domain is recognized on the trusted educational/global whitelist', type: 'safe' });
                checks.push({ text: 'Passed: Secure HTTPS protocol verified', type: 'safe' });
                checks.push({ text: 'Passed: Standard domain structure with no anomalies', type: 'safe' });
            } else {
                // 1. Protocol Check
                if (parsed.protocol === 'http:') {
                    score += 20;
                    checks.push({ text: 'Warning: Uses insecure HTTP instead of encrypted HTTPS', type: 'warn' });
                } else {
                    checks.push({ text: 'Passed: Uses secure HTTPS protocol', type: 'safe' });
                }

                // 2. @ Symbol Check
                if (rawInput.includes('@')) {
                    score += 35;
                    checks.push({ text: 'High Risk: Contains "@" symbol, used for URL redirection spoofing', type: 'danger' });
                } else {
                    checks.push({ text: 'Passed: No credential spoofing symbols found', type: 'safe' });
                }

                // 3. IP Address Host Check
                const ipPattern = /^(\d{1,3}\.){3}\d{1,3}$/;
                if (ipPattern.test(parsed.hostname)) {
                    score += 30;
                    checks.push({ text: 'High Risk: Direct IP address host used instead of domain name', type: 'danger' });
                } else {
                    checks.push({ text: 'Passed: Standard domain name format', type: 'safe' });
                }

                // 4. Subdomain Depth Check (Phishing links often have too many subdomains)
                const subdomains = parsed.hostname.split('.');
                if (subdomains.length > 3) {
                    score += 15;
                    checks.push({ text: 'Warning: Unusually high number of subdomains detected', type: 'warn' });
                } else {
                    checks.push({ text: 'Passed: Normal subdomain depth', type: 'safe' });
                }

                // 5. Typosquatting / Character Substitution Check
                if (parsed.hostname.includes('0') || parsed.hostname.includes('1')) {
                    score += 20;
                    checks.push({ text: 'Warning: Domain contains lookalike numbers (0 for o, 1 for l)', type: 'warn' });
                } else {
                    checks.push({ text: 'Passed: Clean character composition', type: 'safe' });
                }

                // 6. Suspicious TLD & Keyword Check
                const sketchyTlds = ['.xyz', '.tk', '.ml', '.icu', '.top', '.buzz'];
                const sketchyKeywords = ['login', 'secure', 'verify', 'account', 'update', 'signin', 'free-奖励'];
                
                const hasSketchyTld = sketchyTlds.some(tld => parsed.hostname.endsWith(tld));
                const hasSketchyKeyword = sketchyKeywords.some(kw => rawInput.toLowerCase().includes(kw));

                if (hasSketchyTld) {
                    score += 20;
                    checks.push({ text: 'Warning: Uses high-risk domain extension (' + parsed.hostname.split('.').pop() + ')', type: 'warn' });
                }
                if (hasSketchyKeyword) {
                    score += 15;
                    checks.push({ text: 'Notice: Contains sensitive authentication/action keywords', type: 'warn' });
                }
                if (!hasSketchyTld && !hasSketchyKeyword) {
                    checks.push({ text: 'Passed: Standard keyword and TLD profile', type: 'safe' });
                }
            }

            // Cap score at 100
            score = Math.min(score, 100);

            // Render Results
            resProtocol.textContent = parsed.protocol;
            resDomain.textContent = parsed.hostname;
            resScore.textContent = score + ' / 100';

            statusBadge.className = 'status-badge';
            if (score >= 40) {
                statusBadge.textContent = '🔴 High Risk Phishing Alert';
                statusBadge.classList.add('status-danger');
            } else if (score >= 15) {
                statusBadge.textContent = '🟡 Suspicious Link - Exercise Caution';
                statusBadge.classList.add('status-warning');
            } else {
                statusBadge.textContent = '🟢 Link Appears Safe';
                statusBadge.classList.add('status-safe');
            }

            checksList.innerHTML = '';
            checks.forEach(check => {
                const li = document.createElement('li');
                const icon = check.type === 'safe' ? '✅' : (check.type === 'warn' ? '⚠️' : '❌');
                li.innerHTML = `<span>${icon}</span> <span>${check.text}</span>`;
                checksList.appendChild(li);
            });

            resultsDiv.style.display = 'block';
        }
    </script>
</body>
</html>
