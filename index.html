<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhishGuard | Student-Focused URL Safety Analyzer</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #FDFBF7;
            --card-bg: #FFFFFF;
            --text-main: #2C2A29;
            --text-muted: #6B6560;
            --accent: #8B5A2B;
            --border-color: #E8E2D5;
            --safe-bg: #EAF4ED;
            --safe-text: #2D6A4F;
            --warn-bg: #FCF3DC;
            --warn-text: #946200;
            --danger-bg: #FDE8E8;
            --danger-text: #C53030;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 50px 20px;
        }

        .container {
            max-width: 760px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 45px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
            color: var(--text-main);
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.05rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.02);
            margin-bottom: 25px;
        }

        .input-group {
            display: flex;
            gap: 12px;
        }

        input[type="text"] {
            flex: 1;
            padding: 15px 20px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
            background-color: #FAFAF8;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
            background-color: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(139, 90, 43, 0.1);
        }

        button {
            background-color: var(--text-main);
            color: #FFFFFF;
            border: none;
            padding: 15px 28px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background-color: var(--accent);
        }

        .results-container {
            display: none;
            margin-top: 30px;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .status-badge {
            display: inline-block;
            padding: 8px 18px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 24px;
            letter-spacing: -0.01em;
        }

        .status-safe { background-color: var(--safe-bg); color: var(--safe-text); }
        .status-warning { background-color: var(--warn-bg); color: var(--warn-text); }
        .status-danger { background-color: var(--danger-bg); color: var(--danger-text); }

        .breakdown-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .breakdown-box {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 15px;
        }

        .breakdown-box span {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .breakdown-box strong {
            font-size: 0.95rem;
            word-break: break-all;
            color: var(--text-main);
        }

        .checks-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.25rem;
            margin-bottom: 15px;
            color: var(--text-main);
        }

        .checks-list {
            list-style: none;
        }

        .checks-list li {
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .checks-list li:last-child {
            border-bottom: none;
        }

        .check-tag {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            flex-shrink: 0;
        }

        .tag-safe { background-color: var(--safe-bg); color: var(--safe-text); }
        .tag-warn { background-color: var(--warn-bg); color: var(--warn-text); }
        .tag-danger { background-color: var(--danger-bg); color: var(--danger-text); }

        footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>PhishGuard</h1>
            <p>Student-Focused Phishing & Malicious URL Safety Analyzer</p>
        </header>

        <div class="card">
            <div class="input-group">
                <input type="text" id="urlInput" placeholder="Paste link to analyze (e.g., github.com)..." autocomplete="off" spellcheck="false">
                <button onclick="analyzeUrl()">Analyze Link</button>
            </div>

            <div id="results" class="results-container">
                <div id="statusBadge" class="status-badge">Safe</div>

                <div class="breakdown-grid">
                    <div class="breakdown-box">
                        <span>Protocol</span>
                        <strong id="resProtocol">-</strong>
                    </div>
                    <div class="breakdown-box">
                        <span>Domain Hostname</span>
                        <strong id="resDomain">-</strong>
                    </div>
                    <div class="breakdown-box">
                        <span>Calculated Risk Score</span>
                        <strong id="resScore">0 / 100</strong>
                    </div>
                </div>

                <h3 class="checks-title">Security Heuristics Breakdown</h3>
                <ul id="checksList" class="checks-list">
                    <!-- Dynamic check results injected here -->
                </ul>
            </div>
        </div>

        <footer>
            SANKALP 2026 · Chennai Institute of Technology Student Project
        </footer>
    </div>

    <script>
        function analyzeUrl() {
            const rawInput = document.getElementById('urlInput').value.trim();
            const resultsDiv = document.getElementById('results');
            const statusBadge = document.getElementById('statusBadge');
            const resProtocol = document.getElementById('resProtocol');
            const resDomain = document.getElementById('resDomain');
            const resScore = document.getElementById('resScore');
            const checksList = document.getElementById('checksList');

            if (!rawInput) {
                alert('Please enter a valid URL.');
                return;
            }

            let urlToParse = rawInput;
            if (!urlToParse.startsWith('http://') && !urlToParse.startsWith('https://')) {
                urlToParse = 'https://' + urlToParse;
            }

            let parsed;
            try {
                parsed = new URL(urlToParse);
            } catch (e) {
                alert('Invalid URL format.');
                return;
            }

            let score = 0;
            let checks = [];

            const trustedDomains = ['github.com', 'google.com', 'citchennai.edu.in', 'wikipedia.org', 'microsoft.com'];
            const isTrusted = trustedDomains.some(domain => parsed.hostname === domain || parsed.hostname.endsWith('.' + domain));

            if (isTrusted) {
                score = 0;
                checks.push({ text: 'Domain is recognized on the trusted educational and global whitelist', type: 'safe', label: 'Verified' });
                checks.push({ text: 'Secure HTTPS encryption protocol verified', type: 'safe', label: 'Secure' });
                checks.push({ text: 'Standard domain architecture with no structural anomalies', type: 'safe', label: 'Passed' });
            } else {
                if (parsed.protocol === 'http:') {
                    score += 20;
                    checks.push({ text: 'Uses insecure HTTP instead of encrypted HTTPS', type: 'warn', label: 'Warning' });
                } else {
                    checks.push({ text: 'Uses secure HTTPS protocol layer', type: 'safe', label: 'Passed' });
                }

                if (rawInput.includes('@')) {
                    score += 35;
                    checks.push({ text: 'Contains "@" symbol, commonly used for URL redirection spoofing', type: 'danger', label: 'High Risk' });
                } else {
                    checks.push({ text: 'No credential redirection symbols detected', type: 'safe', label: 'Passed' });
                }

                const ipPattern = /^(\d{1,3}\.){3}\d{1,3}$/;
                if (ipPattern.test(parsed.hostname)) {
                    score += 30;
                    checks.push({ text: 'Direct IP address host used instead of standard domain name', type: 'danger', label: 'High Risk' });
                } else {
                    checks.push({ text: 'Standard domain name format observed', type: 'safe', label: 'Passed' });
                }

                const subdomains = parsed.hostname.split('.');
                if (subdomains.length > 3) {
                    score += 15;
                    checks.push({ text: 'Unusually high number of subdomains detected in structure', type: 'warn', label: 'Warning' });
                } else {
                    checks.push({ text: 'Normal subdomain depth profile', type: 'safe', label: 'Passed' });
                }

                if (parsed.hostname.includes('0') || parsed.hostname.includes('1')) {
                    score += 20;
                    checks.push({ text: 'Domain contains lookalike numbers (0 for o, 1 for l)', type: 'warn', label: 'Warning' });
                } else {
                    checks.push({ text: 'Clean character composition in domain string', type: 'safe', label: 'Passed' });
                }

                const sketchyTlds = ['.xyz', '.tk', '.ml', '.icu', '.top', '.buzz'];
                const sketchyKeywords = ['login', 'secure', 'verify', 'account', 'update', 'signin', 'free'];
                
                const hasSketchyTld = sketchyTlds.some(tld => parsed.hostname.endsWith(tld));
                const hasSketchyKeyword = sketchyKeywords.some(kw => rawInput.toLowerCase().includes(kw));

                if (hasSketchyTld) {
                    score += 20;
                    checks.push({ text: 'Uses high-risk or free domain extension (' + parsed.hostname.split('.').pop() + ')', type: 'warn', label: 'Warning' });
                }
                if (hasSketchyKeyword) {
                    score += 15;
                    checks.push({ text: 'Contains sensitive authentication or verification keywords', type: 'warn', label: 'Notice' });
                }
                if (!hasSketchyTld && !hasSketchyKeyword) {
                    checks.push({ text: 'Standard keyword and TLD profile parameters', type: 'safe', label: 'Passed' });
                }
            }

            score = Math.min(score, 100);

            resProtocol.textContent = parsed.protocol;
            resDomain.textContent = parsed.hostname;
            resScore.textContent = score + ' / 100';

            statusBadge.className = 'status-badge';
            if (score >= 40) {
                statusBadge.textContent = 'High Risk Phishing Alert';
                statusBadge.classList.add('status-danger');
            } else if (score >= 15) {
                statusBadge.textContent = 'Suspicious Link - Exercise Caution';
                statusBadge.classList.add('status-warning');
            } else {
                statusBadge.textContent = 'Link Appears Safe';
                statusBadge.classList.add('status-safe');
            }

            checksList.innerHTML = '';
            checks.forEach(check => {
                const li = document.createElement('li');
                const tagClass = check.type === 'safe' ? 'tag-safe' : (check.type === 'warn' ? 'tag-warn' : 'tag-danger');
                li.innerHTML = `<span>${check.text}</span> <span class="check-tag ${tagClass}">${check.label}</span>`;
                checksList.appendChild(li);
            });

            resultsDiv.style.display = 'block';
        }
    </script>
</body>
</html>
